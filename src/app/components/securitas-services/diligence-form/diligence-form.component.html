<form
  [formGroup]="actionForm"
  novalidate=""
  id="contact"
  class="sg_pkj_frm p-0 m-0 bg-transparent"
>
  <div class="row">
    <div class="col-lg-6">
      <fieldset>
        <input
          (focus)="checkLoggedIn(true, $event)"
          type="text"
          name="name1"
          id="name1"
          placeholder="Name"
          formControlName="Name"
          class="form-control"
        />
      </fieldset>
    </div>
    <div class="col-lg-6">
      <fieldset>
        <select
          [disabled]="true"
          name=""
          id="dialCode"
          class="form-control dialCode"
          [(ngModel)]="selectedDialCode"
          [ngModelOptions]="{ standalone: true }"
          (change)="getCountry($event)"
        >
          <option [value]="code.code" *ngFor="let code of dialCodes">
            {{ code.code }}({{ code.dial_code }})
          </option>
        </select>
        <input
          (focus)="checkLoggedIn(true, $event)"
          type="number"
          name="phn"
          id="phn"
          placeholder="Mob No"
          formControlName="MobileNumber"
          min="0"
          class="form-control"
        />
      </fieldset>
    </div>
    <div class="col-lg-12">
      <fieldset>
        <input
          (focus)="checkLoggedIn(true, $event)"
          type="email"
          name="email1"
          id="email1"
          placeholder="E-mail ID"
          formControlName="EmailId"
          class=""
        />
      </fieldset>
    </div>
    <div class="col-lg-12">
      <fieldset>
        <textarea
          (focus)="checkLoggedIn(true, $event)"
          name="message"
          id="message"
          placeholder="Brief Description"
          formControlName="Description"
          class="form-control"
        ></textarea>
      </fieldset>
    </div>
    <div class="col-lg-12">
      <fieldset class="d-flex gap-3 justify-content-end">
        <button
          (click)="
            serviceType?.roleid === userRoleId ? enqSubmit() : askForSignup()
          "
          type="button"
          class="sg_new_submit_btn btn tc_w border-0 rounded-pill bg_prp bg_lred_h tc_h_w btn_shadow ff_reg d-flex align-items-center justify-content-center px-2 btn-sm"
        >
          <i class="bi bi-arrow-right-short fs_16 me-1 me-lg-0 me-xl-1"></i
          ><span> Submit</span>
        </button>
      </fieldset>
    </div>
  </div>
</form>
