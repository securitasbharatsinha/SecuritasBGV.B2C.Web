<section class="sg_sitemap">
  <div class="pb-1 pb-md-3 pt-5 pt-md-5 py-lg-5"></div>
  <div class="container">
    <div class="row">
      <div class="col-12">
        <!-- <h2 class="fw-bold text-center sg_heading_faq mb-5">Sitemap</h2> -->
        <div
          class="section-title position-relative text-center mb-4 pb-2 wow fadeInDown"
          data-wow-delay="0.1s"
        >
          <h6 class="position-relative d-inline tc_prp ps-4"></h6>
          <h2 class="mt-2">Sitemap</h2>
        </div>
      </div>
      <div class="col-lg-12">
        <div
          class="bg-light p-3 pb-0 px-md-4 py-md-4 pb-md-1 rounded-3 border shadow-sm h-100"
        >
          <!-- <h2 class="fw-bold text-center sg_heading_faq mb-4">Sitemap</h2> -->
          <!-- <h5 class="fw-bold">Pages</h5> -->
          <ul class="list-unstyled nav-item d-flex" style="gap: 60px">
            <li>
              <h5 class="fw_7 d-block mb-2">Pages</h5>
              <ul class="list-unstyled">
                <li>
                  <a class="tc_m_blu tc_h_red" [routerLink]="['/home']"
                    ><i class="bi bi-chevron-right"></i> Home</a
                  >
                </li>
                <li>
                  <a [routerLink]="['/individual']" class="tc_m_blu tc_h_red"
                    ><i class="bi bi-chevron-right"></i>Verify Now</a
                  >
                </li>
                <li [hidden]="true">
                  <a [routerLink]="['/corporate']" class="tc_m_blu tc_h_red"
                    ><i class="bi bi-chevron-right"></i> Corporate</a
                  >
                </li>
                <li>
                  <a href="about" class="tc_m_blu tc_h_red"
                    ><i class="bi bi-chevron-right"></i> About Us</a
                  >
                </li>
                <li>
                  <a [routerLink]="['/help-center']" class="tc_m_blu tc_h_red"
                    ><i class="bi bi-chevron-right"></i> Help Desk</a
                  >
                </li>
                <li>
                  <a
                    [routerLink]="['/supplier-connect']"
                    class="tc_m_blu tc_h_red"
                    ><i class="bi bi-chevron-right"></i> Support</a
                  >
                </li>
                <li>
                  <a [routerLink]="['/faq']" class="tc_m_blu tc_h_red"
                    ><i class="bi bi-chevron-right"></i> Supplier Connect</a
                  >
                </li>
              </ul>
            </li>

            <li>
              <h5 class="fw_7 d-block mb-2">Legal</h5>
              <ul class="list-unstyled">
                <li>
                  <a
                    class="tc_m_blu tc_h_red"
                    [routerLink]="['/privacy-policy']"
                    ><i class="bi bi-chevron-right"></i> Privacy Policy</a
                  >
                </li>
                <li>
                  <a
                    href="assets/documents/Terms_and_condition.pdf"
                    target="_blank"
                    class="tc_m_blu tc_h_red"
                    ><i class="bi bi-chevron-right"></i>Terms and Conditions</a
                  >
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="pb-1 pb-md-3 pt-5 pt-md-5 py-lg-5"></div>
</section>
